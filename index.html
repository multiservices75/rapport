<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapports d'intervention HLM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c1e21; --muted:#6b7280;
  --border:#e2e4e8; --accent:#2563eb; --accent-text:#ffffff; --danger:#dc2626;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16181c;--card:#212327;--text:#eceef1;--muted:#9aa0aa;--border:#33363c;--accent:#3b82f6;--accent-text:#ffffff;--danger:#f87171;}
}
:root[data-theme="dark"]{--bg:#16181c;--card:#212327;--text:#eceef1;--muted:#9aa0aa;--border:#33363c;--accent:#3b82f6;--accent-text:#ffffff;--danger:#f87171;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:16px;}
h1{font-size:1.25rem;margin:8px 0 16px;}
h2{font-size:1rem;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;
}
textarea{min-height:80px;resize:vertical;}
.row{display:flex;gap:10px;}
.row>div{flex:1;}
.btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;padding:11px 16px;font-size:.9rem;font-weight:600;cursor:pointer;}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.photo{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.photo img{width:100%;height:100%;object-fit:cover;display:block;}
.photo button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer;}
.addphoto{width:80px;height:80px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:1.5rem;}
canvas.sig-canvas{width:100%;height:140px;border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;}
.sig-actions{display:flex;justify-content:space-between;margin-top:8px;}
.actions{display:flex;gap:10px;margin-top:4px;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-info b{display:block;font-size:.9rem;}
.hist-info span{font-size:.78rem;color:var(--muted);}
.hist-actions{display:flex;gap:6px;}
.hist-actions button{background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.8rem;cursor:pointer;}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:12px 0;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏢 Rapports d'intervention HLM</h1>

  <div class="card">
    <h2>Nouveau rapport</h2>
    <div class="row">
      <div><label>Date</label><input type="date" id="f-date"></div>
      <div><label>Technicien</label><input type="text" id="f-tech" placeholder="Nom"></div>
    </div>
    <label>Adresse / résidence</label>
    <input type="text" id="f-addr" placeholder="Ex : 12 rue des Lilas, bât. B">
    <div class="row">
      <div><label>Logement / local</label><input type="text" id="f-logement" placeholder="Appt 34"></div>
      <div><label>Type d'intervention</label>
        <select id="f-type">
          <option>Plomberie</option><option>Électricité</option><option>Chauffage</option>
          <option>Serrurerie</option><option>Ascenseur</option><option>Parties communes</option>
          <option>Autre</option>
        </select>
      </div>
    </div>
    <label>Description de l'intervention</label>
    <textarea id="f-desc" placeholder="Travaux réalisés, constats, matériel utilisé..."></textarea>

    <label>Photos</label>
    <div class="photos" id="photos">
      <label class="addphoto" for="f-photo">+</label>
      <input type="file" id="f-photo" accept="image/*" capture="environment" multiple style="display:none">
    </div>

    <label>Signature du locataire / responsable</label>
    <canvas class="sig-canvas" id="sig-client"></canvas>
    <div class="sig-actions">
      <span style="font-size:.78rem;color:var(--muted)">À faire signer sur place</span>
      <button class="btn secondary" id="clear-sig-client" type="button">Effacer</button>
    </div>

    <label style="margin-top:16px">Signature du technicien</label>
    <canvas class="sig-canvas" id="sig-tech"></canvas>
    <div class="sig-actions">
      <span style="font-size:.78rem;color:var(--muted)">Signature de l'intervenant</span>
      <button class="btn secondary" id="clear-sig-tech" type="button">Effacer</button>
    </div>

    <div class="actions">
      <button class="btn" id="save-btn">Générer le PDF</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
$('f-date').value = new Date().toISOString().slice(0,10);

// ---- Photos ----
let photos = [];
$('f-photo').addEventListener('change', e=>{
  [...e.target.files].forEach(file=>{
    const r = new FileReader();
    r.onload = ()=>{ photos.push(r.result); renderPhotos(); };
    r.readAsDataURL(file);
  });
  e.target.value = '';
});
function renderPhotos(){
  const c = $('photos');
  c.querySelectorAll('.photo').forEach(el=>el.remove());
  photos.forEach((src,i)=>{
    const d = document.createElement('div'); d.className='photo';
    d.innerHTML = `<img src="${src}"><button type="button" data-i="${i}">×</button>`;
    d.querySelector('button').onclick = ()=>{ photos.splice(i,1); renderPhotos(); };
    c.insertBefore(d, c.firstChild);
  });
}

// ---- Signature pads ----
function makeSigPad(canvas){
  const ctx = canvas.getContext('2d');
  function fitCanvas(){
    const ratio = window.devicePixelRatio||1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w*ratio; canvas.height = h*ratio;
    ctx.scale(ratio,ratio);
    ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
  return { clear: ()=> ctx.clearRect(0,0,canvas.width,canvas.height), dataUrl: ()=> canvas.toDataURL('image/png') };
}
const sigClient = makeSigPad($('sig-client'));
const sigTech = makeSigPad($('sig-tech'));
$('clear-sig-client').onclick = sigClient.clear;
$('clear-sig-tech').onclick = sigTech.clear;

// ---- Toast ----
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ---- Génération PDF ----
function exportPdf(r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  let y = 18;
  doc.setFontSize(16); doc.text("Rapport d'intervention — HLM", 15, y); y+=10;
  doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`Date : ${r.date}`, 15, y); doc.text(`Technicien : ${r.tech||'-'}`, 110, y); y+=7;
  doc.text(`Adresse : ${r.addr||'-'}`, 15, y); y+=6;
  doc.text(`Logement/local : ${r.logement||'-'}`, 15, y); doc.text(`Type : ${r.type}`, 110, y); y+=9;
  doc.setDrawColor(220); doc.line(15,y,195,y); y+=8;
  doc.setTextColor(20); doc.setFontSize(11); doc.text('Description :', 15, y); y+=6;
  doc.setFontSize(10);
  const lines = doc.splitTextToSize(r.desc||'-', 180);
  doc.text(lines, 15, y); y += lines.length*5 + 6;

  if(r.photos && r.photos.length){
    doc.setFontSize(11); doc.text('Photos :', 15, y); y+=6;
    let x = 15;
    for(const p of r.photos){
      if(y > 245){ doc.addPage(); y = 18; }
      try{ doc.addImage(p, 'JPEG', x, y, 40, 40); }catch(e){}
      x += 45;
      if(x > 160){ x = 15; y += 45; }
    }
    y += 48;
  }
  if(y > 235){ doc.addPage(); y=18; }
  doc.setFontSize(11); doc.text('Signatures :', 15, y); y+=5;
  doc.setFontSize(9); doc.setTextColor(90);
  doc.text('Locataire / responsable', 15, y);
  doc.text('Technicien', 110, y);
  y += 3;
  if(r.sigClient){ try{ doc.addImage(r.sigClient, 'PNG', 15, y, 75, 28); }catch(e){} }
  if(r.sigTech){ try{ doc.addImage(r.sigTech, 'PNG', 110, y, 75, 28); }catch(e){} }
  doc.setDrawColor(200);
  doc.rect(15, y, 75, 28); doc.rect(110, y, 75, 28);

  const filename = `rapport-hlm-${(r.addr||'intervention').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${r.date}.pdf`;
  doc.save(filename);
}

$('save-btn').onclick = ()=>{
  const r = {
    date: $('f-date').value || new Date().toISOString().slice(0,10),
    tech: $('f-tech').value,
    addr: $('f-addr').value,
    logement: $('f-logement').value,
    type: $('f-type').value,
    desc: $('f-desc').value,
    photos: [...photos],
    sigClient: sigClient.dataUrl(),
    sigTech: sigTech.dataUrl()
  };
  exportPdf(r);
  toast('PDF généré');
};
</script>
</body>
</html>
