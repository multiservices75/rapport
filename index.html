<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapports d'intervention</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c1e21; --muted:#6b7280;
  --border:#e2e4e8; --accent:#2563eb; --accent-text:#ffffff; --danger:#dc2626;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#16181c;--card:#212327;--text:#eceef1;--muted:#9aa0aa;--border:#33363c;--accent:#3b82f6;--accent-text:#ffffff;--danger:#f87171;}
}
:root[data-theme="dark"]{--bg:#16181c;--card:#212327;--text:#eceef1;--muted:#9aa0aa;--border:#33363c;--accent:#3b82f6;--accent-text:#ffffff;--danger:#f87171;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:16px;}
h1{font-size:1.15rem;margin:8px 0 16px;}
h2{font-size:.9rem;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;}
label:first-child{margin-top:0;}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;
}
textarea{min-height:80px;resize:vertical;}
.row{display:flex;gap:10px;}
.row>div{flex:1;min-width:0;}
.btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;padding:13px 16px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%;}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);width:auto;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.photo{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.photo img{width:100%;height:100%;object-fit:cover;display:block;}
.photo button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer;}
.addphoto{width:76px;height:76px;border:1px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;font-size:1.3rem;gap:2px;}
.addphoto span{font-size:.55rem;line-height:1;text-align:center;}
.photo-buttons{display:flex;gap:8px;margin-top:10px;}
.logo-wrap{position:relative;width:76px;height:76px;}
.logo-wrap .addphoto{width:76px;height:76px;}
#logo-preview{width:76px;height:76px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#fff;display:block;}
.logo-remove{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:13px;line-height:1;cursor:pointer;}
.sig-wrap{position:relative;}
canvas.sig-canvas{width:100%;height:130px;border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;display:block;}
canvas.sig-canvas.locked{pointer-events:none;}
.sig-wrap.locked{cursor:not-allowed;}
.sig-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:.78rem;text-align:center;padding:8px;pointer-events:none;}
.sig-placeholder .ic{font-size:1.3rem;}
.sig-actions{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;}
.sig-actions>span{font-size:.75rem;color:var(--muted);flex:1 1 100%;order:-1;}
.expand-btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:6px;padding:8px 12px;font-size:.85rem;font-weight:600;cursor:pointer;line-height:1;flex:1;}
.sig-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
.sig-modal.open{display:flex;}
.sig-modal-inner{background:var(--card);border-radius:12px;padding:12px;width:100%;max-width:760px;}
.sig-modal-inner h3{margin:0 0 10px;font-size:.9rem;}
canvas#sig-modal-canvas{width:100%;height:min(55vh,420px);border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;display:block;}
.sig-modal-actions{display:flex;justify-content:space-between;margin-top:10px;gap:10px;}
.sig-modal-actions .btn{width:auto;flex:1;}
.actions{display:flex;gap:10px;margin-top:4px;}
@media (max-width:420px){
  .row{flex-direction:column;gap:0;}
  .wrap{padding:12px;}
}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:12px 0;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏢 Rapports d'intervention</h1>

  <div class="card">
    <h2>Coordonnées de l'entreprise</h2>
    <div class="row" style="align-items:flex-start">
      <div style="flex:0 0 auto">
        <label>Logo</label>
        <div class="logo-wrap">
          <img id="logo-preview" style="display:none">
          <label class="addphoto" for="c-logo" id="logo-add"><span>🏢</span><span>Logo</span></label>
          <button type="button" class="logo-remove" id="logo-remove" style="display:none">×</button>
        </div>
        <input type="file" id="c-logo" accept="image/*" style="display:none">
      </div>
      <div style="flex:1">
        <label>Nom de l'entreprise</label><input type="text" id="c-name" value="URGENCE NUISIBLES">
        <label>Téléphone</label><input type="text" id="c-phone" value="01 84 16 52 54">
      </div>
    </div>
    <div class="row">
      <div><label>Adresse</label><input type="text" id="c-addr" value="1 RUE DE NORMANDIE 94550 CHEVILLY LARUE"></div>
      <div><label>Email</label><input type="text" id="c-email" value="ezzogr@gmail.com"></div>
    </div>
  </div>

  <div class="card">
    <h2>Nouveau rapport</h2>
    <div class="row">
      <div><label>Date</label><input type="date" id="f-date"></div>
      <div><label>Client</label><input type="text" id="f-tech" placeholder="Nom"></div>
    </div>
    <label>Adresse / résidence</label>
    <input type="text" id="f-addr" placeholder="Ex : 12 rue des Lilas, bât. B">
    <div class="row">
      <div><label>Logement / local</label><input type="text" id="f-logement" placeholder="Appt 34"></div>
      <div><label>Type d'intervention</label>
        <select id="f-type">
          <option>Traitement punaises de lit</option><option>Traitement dératisation</option><option>traitement insectes rampant</option>
          <option>Traitement insectes volant</option><option>Essaim d'abeilles</option><option>traitement gêpes / frelons</option>
          <option>Autre</option>
        </select>
      </div>
    </div>
    <label>Modèle de description</label>
    <select id="f-desc-tpl">
      <option value="">— Choisir un modèle —</option>
      <option value="Fuite d'eau constatée et réparée. Joint / raccord remplacé. Contrôle d'étanchéité effectué, aucune fuite résiduelle.">Fuite d'eau réparée</option>
      <option value="Débouchage des canalisations effectué. Évacuation vérifiée, écoulement normal rétabli.">Débouchage canalisation</option>
      <option value="Remplacement du robinet / mitigeur défectueux. Mise en service et test de fonctionnement réalisés.">Remplacement robinet</option>
      <option value="Panne électrique diagnostiquée. Disjoncteur / prise / point lumineux réparé ou remplacé. Installation contrôlée, mise sous tension validée.">Panne électrique</option>
      <option value="Contrôle et remise en service du chauffage / radiateur. Purge effectuée, température vérifiée.">Chauffage / radiateur</option>
      <option value="Serrure changée ou réparée. Essai d'ouverture/fermeture concluant, clés remises à l'occupant.">Serrurerie</option>
      <option value="Panne ascenseur diagnostiquée et traitée. Essais de fonctionnement effectués, remise en service validée.">Ascenseur</option>
      <option value="Nettoyage / remise en état des parties communes. Contrôle visuel de sécurité effectué.">Parties communes</option>
    </select>

    <label>Description de l'intervention</label>
    <textarea id="f-desc" placeholder="Travaux réalisés, constats, matériel utilisé..."></textarea>

    <label>Photos</label>
    <div class="photos" id="photos">
      <label class="addphoto" for="f-photo-camera"><span>📷</span><span>Appareil</span></label>
      <label class="addphoto" for="f-photo-library"><span>🖼️</span><span>Bibliothèque</span></label>
      <input type="file" id="f-photo-camera" accept="image/*" capture="environment" multiple style="display:none">
      <input type="file" id="f-photo-library" accept="image/*" multiple style="display:none">
    </div>

    <label>Signature du client / responsable</label>
    <div class="sig-wrap locked" id="wrap-client">
      <canvas class="sig-canvas locked" id="sig-client"></canvas>
      <div class="sig-placeholder" id="ph-client"><span class="ic">✍️</span><span>Touchez « Agrandir pour signer »</span></div>
    </div>
    <div class="sig-actions">
      <span>À faire signer sur place</span>
      <button class="expand-btn" type="button" data-expand="client">⤢ Agrandir pour signer</button>
      <button class="btn secondary" id="clear-sig-client" type="button">Effacer</button>
    </div>

    <label style="margin-top:16px">Signature du technicien</label>
    <div class="sig-wrap locked" id="wrap-tech">
      <canvas class="sig-canvas locked" id="sig-tech"></canvas>
      <div class="sig-placeholder" id="ph-tech"><span class="ic">✍️</span><span>Touchez « Agrandir pour signer »</span></div>
    </div>
    <div class="sig-actions">
      <span>Signature de l'intervenant</span>
      <button class="expand-btn" type="button" data-expand="tech">⤢ Agrandir pour signer</button>
      <button class="btn secondary" id="clear-sig-tech" type="button">Effacer</button>
    </div>

    <div class="actions">
      <button class="btn" id="save-btn">Générer le PDF</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="sig-modal" id="sig-modal">
  <div class="sig-modal-inner">
    <h3 id="sig-modal-title">Signature</h3>
    <canvas id="sig-modal-canvas"></canvas>
    <div class="sig-modal-actions">
      <button class="btn secondary" id="sig-modal-clear" type="button">Effacer</button>
      <button class="btn" id="sig-modal-done" type="button">Valider</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
$('f-date').value = new Date().toISOString().slice(0,10);

// ---- Logo entreprise ----
let companyLogo = null;
const DEFAULT_LOGO_PATH = 'images/logo.png';
function setLogoPreview(dataUrl){
  companyLogo = dataUrl;
  $('logo-preview').src = dataUrl;
  $('logo-preview').style.display = 'block';
  $('logo-add').style.display = 'none';
  $('logo-remove').style.display = 'block';
}
function clearLogo(){
  companyLogo = null;
  $('logo-preview').style.display = 'none';
  $('logo-add').style.display = 'flex';
  $('logo-remove').style.display = 'none';
}
(function loadDefaultLogo(){
  const img = new Image();
  img.onload = ()=>{
    try{
      const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      setLogoPreview(c.toDataURL('image/png'));
    }catch(e){ /* logo local inaccessible (ouverture en fichier local sans serveur) */ }
  };
  img.onerror = ()=>{ /* aucun logo par défaut trouvé dans images/logo.png */ };
  img.src = DEFAULT_LOGO_PATH;
})();
$('c-logo').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=> setLogoPreview(r.result);
  r.readAsDataURL(file);
  e.target.value = '';
});
$('logo-remove').addEventListener('click', clearLogo);

// ---- Photos (appareil photo ou bibliothèque) ----
let photos = [];
function handlePhotoFiles(fileList){
  [...fileList].forEach(file=>{
    const r = new FileReader();
    r.onload = ()=>{ photos.push(r.result); renderPhotos(); };
    r.readAsDataURL(file);
  });
}
$('f-photo-camera').addEventListener('change', e=>{ handlePhotoFiles(e.target.files); e.target.value=''; });
$('f-photo-library').addEventListener('change', e=>{ handlePhotoFiles(e.target.files); e.target.value=''; });
function renderPhotos(){
  const c = $('photos');
  c.querySelectorAll('.photo').forEach(el=>el.remove());
  photos.forEach((src,i)=>{
    const d = document.createElement('div'); d.className='photo';
    d.innerHTML = `<img src="${src}"><button type="button" data-i="${i}">×</button>`;
    d.querySelector('button').onclick = ()=>{ photos.splice(i,1); renderPhotos(); };
    c.insertBefore(d, c.firstChild);
  });
}

// ---- Modèle de description ----
$('f-desc-tpl').addEventListener('change', e=>{
  if(e.target.value) $('f-desc').value = e.target.value;
});

// ---- Signature pads ----
function makeSigPad(canvas, interactive){
  const ctx = canvas.getContext('2d');
  function fitCanvas(){
    const ratio = window.devicePixelRatio||1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w*ratio; canvas.height = h*ratio;
    ctx.scale(ratio,ratio);
    ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing=false; }
  if(interactive){
    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
    canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
  }
  function loadFrom(dataUrl){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!dataUrl) return;
    const img = new Image();
    img.onload = ()=>{
      const ratio = window.devicePixelRatio||1;
      const cw = canvas.width/ratio, ch = canvas.height/ratio;
      const scale = Math.min(cw/img.width, ch/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
    };
    img.src = dataUrl;
  }
  return { clear: ()=> ctx.clearRect(0,0,canvas.width,canvas.height), dataUrl: ()=> canvas.toDataURL('image/png'), loadFrom, isEmpty: ()=> { const d=canvas.toDataURL(); return d===blankData(canvas); } };
}
function blankData(c){
  const b = document.createElement('canvas'); b.width=c.width; b.height=c.height;
  return b.toDataURL();
}
const sigClient = makeSigPad($('sig-client'), false);
const sigTech = makeSigPad($('sig-tech'), false);
$('clear-sig-client').onclick = ()=>{ sigClient.clear(); updatePlaceholder('client'); };
$('clear-sig-tech').onclick = ()=>{ sigTech.clear(); updatePlaceholder('tech'); };
function updatePlaceholder(which){
  const pad = which==='client' ? sigClient : sigTech;
  $('ph-'+which).style.display = pad.isEmpty() ? 'flex' : 'none';
}
updatePlaceholder('client'); updatePlaceholder('tech');

// ---- Modale d'agrandissement pour signer ----
const modal = $('sig-modal');
const modalCanvas = $('sig-modal-canvas');
const modalPad = makeSigPad(modalCanvas, true);
let modalTarget = null, modalKey = null;
function openSigModal(which){
  modalKey = which;
  modalTarget = which === 'client' ? sigClient : sigTech;
  $('sig-modal-title').textContent = which === 'client' ? 'Signature du locataire / responsable' : 'Signature du technicien';
  modal.classList.add('open');
  requestAnimationFrame(()=>{
    // redimensionne le canvas maintenant qu'il est visible, puis recharge la signature existante
    const ratio = window.devicePixelRatio||1;
    modalCanvas.width = modalCanvas.clientWidth*ratio; modalCanvas.height = modalCanvas.clientHeight*ratio;
    const mctx = modalCanvas.getContext('2d');
    mctx.scale(ratio,ratio); mctx.lineWidth=2; mctx.lineCap='round'; mctx.strokeStyle='#111';
    modalPad.clear();
    modalPad.loadFrom(modalTarget.dataUrl());
  });
}
document.querySelectorAll('[data-expand]').forEach(btn=>{
  btn.addEventListener('click', ()=> openSigModal(btn.dataset.expand));
});
$('sig-modal-clear').onclick = modalPad.clear;
$('sig-modal-done').onclick = ()=>{
  if(modalTarget && modalKey){ modalTarget.loadFrom(modalPad.dataUrl()); updatePlaceholder(modalKey); }
  modal.classList.remove('open');
};

// ---- Toast ----
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ---- Génération PDF ----
function exportPdf(r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  let y = 16;
  const textX = r.logo ? 38 : 15;
  if(r.logo){
    const fmt = r.logo.includes('image/png') ? 'PNG' : (r.logo.includes('image/webp') ? 'WEBP' : 'JPEG');
    try{ doc.addImage(r.logo, fmt, 15, 10, 20, 20); }catch(e){}
  }
  doc.setFontSize(12); doc.setTextColor(20);
  doc.text(r.company.name || "Entreprise", textX, y); y+=5;
  doc.setFontSize(8.5); doc.setTextColor(100);
  const coLine = [r.company.addr, r.company.phone, r.company.email].filter(Boolean).join('  ·  ');
  if(coLine) doc.text(doc.splitTextToSize(coLine, 195-textX), textX, y);
  y = Math.max(y+8, 34);
  doc.setDrawColor(220); doc.line(15,y,195,y); y+=8;
  doc.setFontSize(16); doc.setTextColor(20); doc.text("Rapport d'intervention", 15, y); y+=10;
  doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`Date : ${r.date}`, 15, y); doc.text(`Technicien : ${r.tech||'-'}`, 110, y); y+=7;
  doc.text(`Adresse : ${r.addr||'-'}`, 15, y); y+=6;
  doc.text(`Logement/local : ${r.logement||'-'}`, 15, y); doc.text(`Type : ${r.type}`, 110, y); y+=9;
  doc.setDrawColor(220); doc.line(15,y,195,y); y+=8;
  doc.setTextColor(20); doc.setFontSize(11); doc.text('Description :', 15, y); y+=6;
  doc.setFontSize(10);
  const lines = doc.splitTextToSize(r.desc||'-', 180);
  doc.text(lines, 15, y); y += lines.length*5 + 6;

  if(r.photos && r.photos.length){
    doc.setFontSize(11); doc.text('Photos :', 15, y); y+=6;
    let x = 15;
    for(const p of r.photos){
      if(y > 245){ doc.addPage(); y = 18; }
      try{ doc.addImage(p, 'JPEG', x, y, 40, 40); }catch(e){}
      x += 45;
      if(x > 160){ x = 15; y += 45; }
    }
    y += 48;
  }
  if(y > 235){ doc.addPage(); y=18; }
  doc.setFontSize(11); doc.text('Signatures :', 15, y); y+=5;
  doc.setFontSize(9); doc.setTextColor(90);
  doc.text('Locataire / responsable', 15, y);
  doc.text('Technicien', 110, y);
  y += 3;
  if(r.sigClient){ try{ doc.addImage(r.sigClient, 'PNG', 15, y, 75, 28); }catch(e){} }
  if(r.sigTech){ try{ doc.addImage(r.sigTech, 'PNG', 110, y, 75, 28); }catch(e){} }
  doc.setDrawColor(200);
  doc.rect(15, y, 75, 28); doc.rect(110, y, 75, 28);

  const filename = `rapport-${(r.addr||'intervention').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${r.date}.pdf`;
  doc.save(filename);
}

$('save-btn').onclick = ()=>{
  const r = {
    company: { name: $('c-name').value, addr: $('c-addr').value, phone: $('c-phone').value, email: $('c-email').value },
    logo: companyLogo,
    date: $('f-date').value || new Date().toISOString().slice(0,10),
    tech: $('f-tech').value,
    addr: $('f-addr').value,
    logement: $('f-logement').value,
    type: $('f-type').value,
    desc: $('f-desc').value,
    photos: [...photos],
    sigClient: sigClient.dataUrl(),
    sigTech: sigTech.dataUrl()
  };
  exportPdf(r);
  toast('PDF généré');
};
</script>
</body>
</html>
